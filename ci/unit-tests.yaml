test-nix-yk8s:
  image: "${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/nixos/nix:2.30.1"
  stage: unit-tests
  variables:
    NIX_CONFIG: |
      experimental-features = nix-command flakes
  script:
    - nix flake check
  tags:
    - docker
  rules:
    - if: $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"
      when: on_success
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached" || $CI_MERGE_REQUEST_EVENT_TYPE == "merged_result"'
      changes:
      - 'nix/test.nix'
      - 'nix/tests/*'
      - 'nix/tests/**/*'
      when: on_success
    - when: never
