.test-rules-changes: &test-rules-changes
      changes:
      # match files/directories in the root which are not "docs"
      - '{[^d]*,d,d[^o]*,do,do[^c]*,doc,doc[^s]*,docs?*}'
      # match changes in subdirs other than "docs"
      - '{[^d]*,d,d[^o]*,do,do[^c]*,doc,doc[^s]*,docs?*}/**/*'

.cluster-rules-containerd:
  rules:
    # run on merge.merge_train only if files outside docs have changed
    - if: $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"
      <<: *test-rules-changes
      when: on_success
    # run always on release-prepare
    - if: '$CI_COMMIT_BRANCH =~ $REGEX_RELEASE_PREPARE_BRANCH_PREFIX'
      when: on_success
    # otherwise create manual job
    - when: manual
      allow_failure: true

.cluster-rules-k8s-upgrade:
  rules:
    # run always on release-prepare
    - if: '$CI_COMMIT_BRANCH =~ $REGEX_RELEASE_PREPARE_BRANCH_PREFIX'
      needs: ["containerd"]
      when: on_success
    # run on scheduled jobs on default branch
    - if: $CI_PIPELINE_SOURCE == "schedule" &&  $CI_COMMIT_BRANCH == $YAOOK_K8S_DEFAULT_BRANCH
      needs: ["containerd"]
      when: on_success
    # otherwise create manual job
    - when: manual
      allow_failure: true

.test_upgrade_path_k8s_cluster:
  image: "${YAOOK_K8S_CI_IMAGE_NAME}:${YAOOK_K8S_CI_IMAGE_TAG}"
  services: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", services]
  before_script:
  - !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", before_script]
  script:
    # Spawn and test cluster
  - tomlq --in-place --toml-output '.kubernetes.version = "1.29.13"' config/config.toml
  - !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", script]

    # Upgrade cluster to k8s v1.30
  - MANAGED_K8S_RELEASE_THE_KRAKEN=true ./managed-k8s/actions/upgrade.sh 1.30.8
    # Update k8s version
  - tomlq --in-place --toml-output '.kubernetes.version = "1.30.8"' config/config.toml
  - ./managed-k8s/actions/k8s-login.sh

    # Shuffle once more
  - ./managed-k8s/actions/apply-custom.sh
  - ./managed-k8s/ci/test.sh
  - ./managed-k8s/actions/test.sh
  after_script:
  - !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", after_script]
  artifacts: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", artifacts]
  tags: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", tags]

include:
  - local: ci/templates/prepare-spawn-test-cleanup-k8s-cluster.yaml

# Spawn a cluster with calico as CNI, containerd as CRI and
# rook enabled (MR only)
containerd:
  environment:
    name: spawn-cluster
  rules: !reference [.cluster-rules-containerd, rules]
  extends: ".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster"
  stage: cluster-tests
  script:
  - !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", script]
  retry: 2
  variables:
    # the variables defined in .test_upgrade_path_k8s_cluster get overwritten,
    # so we need to reference the default vars here (only one level of nesting is allowed)
    ANSIBLE_ANY_ERRORS_FATAL: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ANSIBLE_ANY_ERRORS_FATAL]
    ANSIBLE_FORCE_COLOR: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ANSIBLE_FORCE_COLOR]
    MANAGED_K8S_LATEST_RELEASE: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, MANAGED_K8S_LATEST_RELEASE]

# Spawn a cluster with the previous release version, then upgrade it to the current
upgrade-major-release:
  environment:
    name: spawn-cluster
  rules:
    # only run on release-prepare
    - if: '$CI_COMMIT_BRANCH =~ $REGEX_RELEASE_PREPARE_BRANCH_PREFIX'
      when: on_success
    # otherwise create manual job
    - when: manual
      allow_failure: true
  extends: ".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster"
  stage: cluster-tests
  before_script:
  - git fetch --unshallow
  - git checkout release/v8.1

  # begin before_script from v8.1
  - "export wg_conf_name=wg0"
  # id_rsa must be set as `File` input in the GitLab CI/CD variables of the
  # repository.
  - 'cp "$id_rsa" /root/.ssh/id_rsa && chmod go-rwx -R /root/.ssh'
  # OS_PASSWORD must be set as `Variable` input in the GitLab CI/CD variables of
  # the repository.
  - . /root/openrc.sh
  - git clean -f .
  - "chmod o-w *"
  - rm -rf ci # make sure we're operating on a clean directory
  - git checkout -- ci
  - export MANAGED_K8S_GIT="$(realpath .)"
  - cd ci
  - git init
  - direnv allow
  - eval $(direnv export bash) # This mimics `cd`ing into the directory with an interactive shell
  - ../actions/init-cluster-repo.sh
  - ../actions/init-cluster-repo.sh # A second run to check idempotency
  - cp res/custom-play.yaml k8s-custom/main.yaml
    # Note that this is basically a dummy keypair that is not used to protect any significant data
  - gpg --quick-generate-key --batch --passphrase '' mk8s-ci@gitlab rsa1024 encr never
    # Ensure that the project is clean
  - python3 clean-up-os-project.py
  # end before_script from v8.1

  script:

  # begin script from v8.1
  - export VAULT_ADDR=https://yaook-vault:8200
  - mkdir -p $CI_PROJECT_DIR/tls/ca
  - printf "%s" "$ci_cert_vaultca_crt" > $CI_PROJECT_DIR/tls/ca/vaultca.crt
  - export VAULT_CACERT="$CI_PROJECT_DIR/tls/ca/vaultca.crt"
  - vault operator init -key-shares=1 -key-threshold=1 -format=json > $CI_PROJECT_DIR/vault_init.out
  - jq .root_token -c $CI_PROJECT_DIR/vault_init.out -r | tee $CI_PROJECT_DIR/root.key
  - jq .unseal_keys_b64[0] -c $CI_PROJECT_DIR/vault_init.out -r | tee $CI_PROJECT_DIR/unseal.key
  - vault operator unseal $(cat $CI_PROJECT_DIR/unseal.key)
  - vault login $(cat $CI_PROJECT_DIR/root.key)
  - bash ./managed-k8s/tools/vault/init.sh
  - bash ./managed-k8s/tools/vault/mkcluster-root.sh
  - export VAULT_TOKEN=$(cat $CI_PROJECT_DIR/root.key)
    # Insert IPSec PSK
  - vault kv put yaook/k8s.ci.yaook.cloud/kv/ipsec-eap-psk ipsec_eap_psk="$IPSEC_EAP_PSK"
    # Create custom play
  - cp custom-play.yaml k8s-custom/main.yaml
  - ./managed-k8s/actions/apply-terraform.sh
  # - ./reachability-or-recreate.sh
  # - export AFLAGS="-e ansible_ssh_private_key_file=/root/.ssh/id_rsa"
  # - ./managed-k8s/actions/apply-all.sh
  # - MANAGED_K8S_RELEASE_THE_KRAKEN=true ./managed-k8s/actions/update-frontend-nodes.sh
  # - MANAGED_K8S_RELEASE_THE_KRAKEN=true ./managed-k8s/actions/update-kubernetes-nodes.sh
  # - ./managed-k8s/actions/apply-custom.sh
  # - ./managed-k8s/actions/test.sh
  # end script from v8.1

  - git -C managed-k8s checkout "${CI_COMMIT_SHA}"
  - tomlq --in-place --toml-output '.terraform.prevent_disruption = false' config/config.toml # migration needs disruption
  - git add .
  - git config --global user.email "k8s-ci@yaook.cloud"
  - git config --global user.name "YAOOK/K8s CI"
  - git commit -m "before migration to v8.1"
  - ./managed-k8s/actions/migrate-cluster-repo.sh || true # the first run will always fail
  - |
    nix run nixpkgs#patch ./config/default.nix <<EOF
    34,36d33
    <       haproxy_ports = [
    <         30060
    <       ];
    87c84
    <     load-balancing = {
    ---
    >     load-balancing = rec {
    90c87
    <         "{{ deprecated_nodeport_lb_test_port }}"
    ---
    >         deprecated_nodeport_lb_test_port
    162c159
    <       rook = {
    ---
    >       rook = rec {
    165d161
    <         use_helm = true;
    181c177
    <         mds_memory_request = "{{ rook_mds_memory_limit }}";
    ---
    >         mds_memory_request = mds_memory_limit;
    183c179
    <         mds_cpu_request = "{{ rook_mds_cpu_limit }}";
    ---
    >         mds_cpu_request = mds_cpu_limit;
    EOF
  - git add .
  - git commit -m "fix config for migration to v8.1"
  - MANAGED_K8S_DISRUPT_THE_HARBOUR=true ./managed-k8s/actions/migrate-cluster-repo.sh # second run to finish migration
  - ./managed-k8s/actions/apply-all.sh
  - ./managed-k8s/ci/test.sh
  - ./managed-k8s/actions/test.sh
  retry: 2
  variables:
    # the variables defined in .test_upgrade_path_k8s_cluster get overwritten,
    # so we need to reference the default vars here (only one level of nesting is allowed)
    WG_COMPANY_USERS: "false" # removed in v9
    ANSIBLE_ANY_ERRORS_FATAL: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ANSIBLE_ANY_ERRORS_FATAL]
    ANSIBLE_FORCE_COLOR: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ANSIBLE_FORCE_COLOR]
    MANAGED_K8S_LATEST_RELEASE: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, MANAGED_K8S_LATEST_RELEASE]

# with dual stack
containerd-ds:
  environment:
    name: spawn-cluster
  rules: !reference [.cluster-rules-containerd, rules]
  extends: ".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster"
  stage: cluster-tests
  script:
  - tomlq --in-place --toml-output '.terraform.ipv6_enabled = true' config/config.toml
  - !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", script]
  retry: 2
  variables:
    # the variables defined in .test_upgrade_path_k8s_cluster get overwritten,
    # so we need to reference the default vars here (only one level of nesting is allowed)
    ANSIBLE_ANY_ERRORS_FATAL: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ANSIBLE_ANY_ERRORS_FATAL]
    ANSIBLE_FORCE_COLOR: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ANSIBLE_FORCE_COLOR]
    MANAGED_K8S_LATEST_RELEASE: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, MANAGED_K8S_LATEST_RELEASE]

# Spawn a cluster and test the k8s upgrade path (w/ calico)
containerd-k8s-upgrade:
  environment:
    name: spawn-cluster
  rules: !reference [.cluster-rules-k8s-upgrade, rules]
  extends: .test_upgrade_path_k8s_cluster
  stage: cluster-tests
  retry: 2
  variables:
    # the variables defined in .test_upgrade_path_k8s_cluster get overwritten,
    # so we need to reference the default vars here (only one level of nesting is allowed)
    ANSIBLE_ANY_ERRORS_FATAL: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ANSIBLE_ANY_ERRORS_FATAL]
    ANSIBLE_FORCE_COLOR: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ANSIBLE_FORCE_COLOR]
    MANAGED_K8S_LATEST_RELEASE: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, MANAGED_K8S_LATEST_RELEASE]
    ci_vault_config_hcl: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ci_vault_config_hcl]
    ci_cert_vaultchain_crt: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ci_cert_vaultchain_crt]
    ci_cert_vault_key: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ci_cert_vault_key]
    ci_cert_vaultca_crt: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ci_cert_vaultca_crt]


  after_script:
    # artifacts are overridden by later stages, so we need to re-export the variable here
    # for context see https://gitlab.com/yaook/k8s/-/merge_requests/1175#note_1959887865
    - echo "YAOOK_K8S_CI_IMAGE_TAG=$YAOOK_K8S_CI_IMAGE_TAG" > ci/image.env
    - cd ci/
    - eval $(direnv export bash) # This mimics `cd`ing into the directory with an interactive shell
    - ./after_script_cleanup.sh

  artifacts:
    reports:
      dotenv: ci/image.env
    paths:
      - ci/podlogs/
    when: always
  tags:
    - docker
    - wireguard-ready

# with dual stack
containerd-ds-k8s-upgrade:
  environment:
    name: spawn-cluster
  rules: !reference [.cluster-rules-k8s-upgrade, rules]
  extends: .test_upgrade_path_k8s_cluster
  stage: cluster-tests
  script:
  - tomlq --in-place --toml-output '.terraform.ipv6_enabled = true' config/config.toml
  - !reference [.test_upgrade_path_k8s_cluster, script]
  retry: 2
  variables:
    # the variables defined in .test_upgrade_path_k8s_cluster get overwritten,
    # so we need to reference the default vars here (only one level of nesting is allowed)
    ANSIBLE_ANY_ERRORS_FATAL: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ANSIBLE_ANY_ERRORS_FATAL]
    ANSIBLE_FORCE_COLOR: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ANSIBLE_FORCE_COLOR]
    MANAGED_K8S_LATEST_RELEASE: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, MANAGED_K8S_LATEST_RELEASE]
    ci_vault_config_hcl: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ci_vault_config_hcl]
    ci_cert_vaultchain_crt: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ci_cert_vaultchain_crt]
    ci_cert_vault_key: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ci_cert_vault_key]
    ci_cert_vaultca_crt: !reference [".$[[ inputs.release_version ]]prepare_spawn_test_cleanup_k8s_cluster", variables, ci_cert_vaultca_crt]
