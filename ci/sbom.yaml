generate-sbom:
  stage: sbom
  image: "${YAOOK_K8S_CI_IMAGE_NAME}:${YAOOK_K8S_CI_IMAGE_TAG}"
  needs:
    - build_image
  script:
    - echo "Generating Nix package SBOMs..."
    - nix build .#sbom-dev -o sbom-dev.cdx.json
    - nix build .#sbom-ci -o sbom-ci.cdx.json
    - echo "Merge the generated Nix package SBOMs..."
    - echo "Generating CI-Image SBOM..."
    - syft ${YAOOK_K8S_CI_IMAGE_NAME}:${YAOOK_K8S_CI_IMAGE_TAG} -o cyclonedx-json=./tarook-ci-image.cdx.json
    - python3 tools/generate_runtime_sbom.py -a $CI_PROJECT_DIR/ansible/requirements.yaml -n $CI_PROJECT_DIR/nix/yk8s/k8s-supplements -o runtime-sbom.cdx.json
    - cyclonedx merge --input-files sbom-dev.cdx.json sbom-ci.cdx.json tarook-ci-image.cdx.json runtime-sbom.cdx.json --output-file sbom.cdx.json
    - cyclonedx validate --input-file sbom.cdx.json
  artifacts:
    name: "tarook-sbom"
    paths:
      - sbom.cdx.json
    expire_in: 1 year
    when: always
  rules:
    # TODO: adjust the rules
    #- if: '$CI_COMMIT_BRANCH =~ /^release\/v/'
    - when: manual
      allow_failure: true
  tags:
    - docker
