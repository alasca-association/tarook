[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tarook"
version = "0.1.0"
description = "CLI for Tarook cluster management"
license = "Apache-2.0"

dependencies = [
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "isort>=5.0",
    "flake8>=6.0",
]

[project.scripts]
tarook = "cli:cli"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
