---
- name: Restart kubelet
  delegate_to: "{{ item }}"
  loop: "{{ groups['k8s_nodes'] }}"
  become: true
  run_once: true
  service:
    name: kubelet
    state: restarted

- name: Restart only this kubelet
  become: true
  service:
    name: kubelet
    state: restarted

- name: Restart kube-apiserver  # noqa no-changed-when
  become: true
  command:
  args:
    argv:
    - /usr/local/lib/tarook/restart-container.sh
    - kube-apiserver
  register: container_restart
  until: container_restart is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"

- name: Restart kube-scheduler  # noqa no-changed-when
  become: true
  command:
  args:
    argv:
    - /usr/local/lib/tarook/restart-container.sh
    - kube-scheduler
  register: container_restart
  until: container_restart is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"

- name: Restart kube-controller-manager  # noqa no-changed-when
  become: true
  command:
  args:
    argv:
    - /usr/local/lib/tarook/restart-container.sh
    - kube-controller-manager
  register: container_restart
  until: container_restart is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"

- name: Restart etcd  # noqa no-changed-when
  become: true
  command:
  args:
    argv:
    - /usr/local/lib/tarook/restart-container.sh
    - etcd
  register: container_restart
  until: container_restart is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"

- name: Ensure cluster-signing-cert-file is set
  become: true
  replace:
    path: /etc/kubernetes/manifests/kube-controller-manager.yaml
    regexp: '^(\s*-\s*--cluster-signing-cert-file=).*'
    replace: "\\1/etc/kubernetes/pki/ca.crt"

- name: Ensure cluster-signing-cert-file is unset
  become: true
  replace:
    path: /etc/kubernetes/manifests/kube-controller-manager.yaml
    regexp: '^(\s*-\s*--cluster-signing-cert-file=).*'
    replace: "\\1"

- name: Ensure cluster-signing-key-file is set
  become: true
  replace:
    path: /etc/kubernetes/manifests/kube-controller-manager.yaml
    regexp: '^(\s*-\s*--cluster-signing-key-file=).*'
    replace: "\\1/etc/kubernetes/pki/ca.key"

- name: Ensure cluster-signing-key-file is unset
  become: true
  replace:
    path: /etc/kubernetes/manifests/kube-controller-manager.yaml
    regexp: '^(\s*-\s*--cluster-signing-key-file=).*'
    replace: "\\1"

- name: noop
  # this handler is used as default in mkkubeconfig, if the caller specified no handler to notify
  debug:
    msg: Nothing to see here, move along.
...
