---
- name: Fetch CA certificates
  ansible.builtin.set_fact:
    k8s_ca_cert: "{{ lookup('template', 'ca.crt.j2', template_vars={'ca_pki_name': 'k8s-pki', 'vault_cluster_name': next_vault_cluster_name if extra_ca else vault_cluster_name}) }}"
    k8s_front_proxy_ca_cert: "{{ lookup('template', 'ca.crt.j2', template_vars={'ca_pki_name': 'k8s-front-proxy-pki', 'vault_cluster_name': next_vault_cluster_name if extra_ca else vault_cluster_name}) }}"
    etcd_ca_cert: "{{ lookup('template', 'ca.crt.j2', template_vars={'ca_pki_name': 'etcd-pki', 'vault_cluster_name': next_vault_cluster_name if extra_ca else vault_cluster_name}) }}"

- name: Fetch previous CA certificates
  when: extra_ca
  ansible.builtin.set_fact:
    k8s_prev_ca_cert: "{{ lookup('template', 'ca.crt.j2', template_vars={'ca_pki_name': 'k8s-pki', 'vault_cluster_name': vault_cluster_name}) }}"
    k8s_prev_front_proxy_ca_cert: "{{ lookup('template', 'ca.crt.j2', template_vars={'ca_pki_name': 'k8s-front-proxy-pki', 'vault_cluster_name': vault_cluster_name}) }}"
    etcd_prev_ca_cert: "{{ lookup('template', 'ca.crt.j2', template_vars={'ca_pki_name': 'etcd-pki', 'vault_cluster_name': vault_cluster_name}) }}"
...
