---
# https://developer.hashicorp.com/vault/tutorials/getting-started/getting-started-install
- name: Add Hashicorp repository & install vault-cli
  # run only once per run per node
  become: true
  block:
  - name: Ensure keyrings directory exists
    file:
      state: directory
      path: /etc/apt/keyrings
      owner: root
      group: root
      mode: u=rwx,go=rx

  - name: Deploy Hashicorp repository key
    copy:
      src: hashicorp-archive-keyring.gpg
      dest: /etc/apt/keyrings/hashicorp-archive-keyring.gpg
      owner: root
      group: root
      mode: u=rw,go=r

  # TODO: @deprecated This task can be dropped in a release >=v17
  - name: Remove legacy apt configuration
    file:
      path: /etc/apt/sources.list.d/hashicorp.list
      state: absent

  - name: Add Hashicorp repository
    copy:
      dest: /etc/apt/sources.list.d/hashicorp.sources
      content: |
        Types: deb
        URIs: https://apt.releases.hashicorp.com
        Suites: {{ ansible_distribution_release }}
        Components: main
        Signed-By: /etc/apt/keyrings/hashicorp-archive-keyring.gpg
      owner: root
      group: root
      mode: 0640

  - name: Update apt cache
    apt:
      update_cache: true
    register: task_result
    until: task_result is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"

  - name: Install vault-cli
    package:
      state: present
      name: vault
    register: task_result
    until: task_result is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"
...
