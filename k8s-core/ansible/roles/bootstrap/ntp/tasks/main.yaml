---
- name: Populate service facts
  service_facts:

- name: stop systemd time sync
  become: true
  become_user: root
  service:
    name: systemd-timesyncd
    enabled: false
  when: ansible_facts.services['systemd-timesyncd'] is defined

- name: install chrony
  become: true
  become_user: root
  package:
    name:
    - chrony
    state: present
  register: task_result
  until: task_result is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"

- name: Configure chrony
  become: true
  when: custom_chrony_configuration | bool
  block:

  - name: Configure chrony (Debian based)
    when: ansible_os_family == "Debian"
    block:

    - name: Create custom configuration (Debian)
      template:
        src: chrony.conf.j2
        dest: /etc/chrony/chrony.conf
        owner: root
        group: root
        mode: 0644
      register: configuration_update_debian

    - name: Restart chrony  # noqa no-handler
      when: configuration_update_debian.changed
      systemd:
        name: chrony
        enabled: true
        state: restarted
        daemon_reload: true

- name: ensure chrony is running
  become: true
  become_user: root
  service:
    name: chronyd
    state: started
    enabled: true

- name: disable systemd time sync
  become: true
  become_user: root
  service:
    name: systemd-timesyncd
    state: stopped
  when: ansible_facts.services['systemd-timesyncd'] is defined
...
