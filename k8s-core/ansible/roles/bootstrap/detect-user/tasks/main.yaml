---
- name: wait for ssh to become available
  delegate_to: "{{ groups['orchestrator'] | first }}"
  become: false
  wait_for:
    host: "{{ ansible_host | default(inventory_hostname) }}"
    port: 22
    sleep: 5
    timeout: 900  # 15min
    state: started
  check_mode: false
  tags:
  - detect-user

- name: Ensure etc_dir exists
  delegate_to: "{{ groups['orchestrator'] | first }}"
  file:
    path: "{{ etc_dir }}"
    state: directory
    mode: '0755'
  check_mode: false
  tags:
  - detect-user

- name: Detect login username (when ansible_user is not defined)
  when: ansible_user is not defined
  delegate_to: "{{ groups['orchestrator'] | first }}"
  tags:
  - detect-user
  - always
  block:
  - name: test logins  # noqa risky-shell-pipe
    become: false
    # this is "slightly" ugly, but should take into account many possible ways
    # to tweak how ansible does things
    shell: |
      ssh \
        -o ConnectTimeout=10 \
        -o PasswordAuthentication=no \
        {% if ansible_ssh_private_key_file | default(False) %}-i {{ ansible_ssh_private_key_file | quote }}{% endif %} \
        {% if ansible_port | default(False) %}-p {{ ansible_port }}{% endif %} \
        -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ ssh_known_hosts_file }} \
        {{ ansible_ssh_extra_args | default("") }} \
        {{ item | quote }}@{{ ansible_host | default(inventory_hostname) | quote }} \
        true </dev/null
    loop: "{{ detect_user_attempts | unique }}"
    failed_when: false
    changed_when: false
    register: login_results
    check_mode: false
    tags:
    - detect-user
    - always

  - name: set ansible_user for which login succeeded
    vars:
      valid_users: >
        {{
          login_results.results
          | reject('failed') | reject('unreachable')
          | selectattr('rc', 'equalto', 0)
          | default([])
        }}
    when: (valid_users | length) > 0
    set_fact:
      ansible_user: "{{ valid_users[0].item }}"
      cacheable: true
    check_mode: false
    tags:
    - detect-user
    - always

  - name: fail if no login succeeded
    fail:
      msg: |
        Failed to find a usable login!
        Tested users: {{ detect_user_attempts | join(', ') }}

        Login attempts:
        {% for login_attempt in login_results.results %}
        $ {{ login_attempt.cmd | trim('\n') }}
        {{ login_attempt.stderr }}
        ---
        {% endfor %}
    when: ansible_user is not defined
    check_mode: false
    tags:
    - detect-user
    - always

- name: show login info
  debug:
    msg: "will henceforth use {{ ansible_user }} to connect to {{ inventory_hostname }}"
  check_mode: false
  tags:
  - detect-user

- name: test new login
  become: false
  raw: whoami
  changed_when: false
  register: whoami
  check_mode: false
  failed_when: "ansible_user not in whoami.stdout_lines"
  tags:
  - detect-user
  - always

- name: warn if a generic user is being used
  debug:
    msg: |
      WARNING: The login to

        {{ inventory_hostname }}

      uses the user name

        {{ whoami.stdout }},

      which is a generic user. This is only okay if this is the first roll out
      to the machine.

      If this is *not* the first rollout, this indicates a problem with the
      user setup and should be investigated.
  when: "whoami.stdout in detect_user_warn"
  check_mode: false
  tags:
  - detect-user
  - always
...
