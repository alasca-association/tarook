---
- name: wait for ssh to become available
  delegate_to: "{{ groups['orchestrator'] | first }}"
  become: false
  ansible.builtin.wait_for:
    host: "{{ ansible_host | default(inventory_hostname) }}"
    port: 22
    sleep: 5
    timeout: 300
    state: started
  check_mode: false
  tags:
  - detect-user

- name: Ensure etc_dir exists
  delegate_to: "{{ groups['orchestrator'] | first }}"
  ansible.builtin.file:
    path: "{{ etc_dir }}"
    state: directory
    mode: '0755'
  check_mode: false
  tags:
  - detect-user

- block:
  - include_tasks:
      file: login.yaml
    vars:
      username: "{{ lookup('env', 'MANAGED_K8S_SSH_USER') or ansible_user | default(false) or lookup('env', 'USER') }}"
      error_retries: "{{ k8s_error_retries }}"
      error_delay: "{{ k8s_error_delay }}"
  rescue:
  - include_tasks:
      file: login.yaml
    vars:
      username: hostvars[host]['default_login']

- name: show login info
  ansible.builtin.debug:
    msg: "will henceforth use {{ ansible_user }} to connect to {{ inventory_hostname }}"
  check_mode: false
  tags:
  - detect-user

- name: test new login
  become: false
  ansible.builtin.raw: whoami
  changed_when: false
  register: whoami
  check_mode: false
  failed_when: "ansible_user not in whoami.stdout_lines"
  tags:
  - detect-user
  - always

- name: warn if a generic user is being used
  ansible.builtin.debug:
    msg: |
      WARNING: The login to

        {{ inventory_hostname }}

      uses the user name

        {{ whoami.stdout }},

      which is a generic user. This is only okay if this is the first roll out
      to the machine.

      If this is *not* the first rollout, this indicates a problem with the
      user setup and should be investigated.
  when: "whoami.stdout in detect_user_warn"
  check_mode: false
  tags:
  - detect-user
  - always
...
