---
- name: "Slurp public key content of {{ host_key_path }}"
  become: true
  slurp:
    src: "{{ host_key_path }}"
  register: host_key

- name: "Sign public key {{ host_key_path }}"
  delegate_to: "{{ groups['orchestrator'] | first }}"
  delegate_facts: true
  community.hashi_vault.vault_write:
    path: "{{ vault_path_prefix }}/{{ vault_cluster_name }}/ssh-ca/sign/{{ vault_node_name }}"
    mount_point: "{{ vault_nodes_approle }}"
    auth_method: approle
    role_id: "{{ vault_node_role_id }}"
    secret_id: "{{ vault_node_secret_id }}"
    token_validate: false
    data:
      cert_type: host
      public_key: "{{ host_key.content | b64decode }}"
      # NOTE: This definition should match `allowed_domains` in the vault-onboarded role
      #       - k8s-core/ansible/roles/bootstrap/vault-onboarded/tasks/main.yaml
      valid_principals: >
        {{
          (
            [
              inventory_hostname,
              ansible_host
            ]
            + (
              (local_ipv4_address | default(none)) is not none
              | ternary([local_ipv4_address], [])
            )
            + (
              (local_ipv6_address | default(none)) is not none
              | ternary([local_ipv6_address], [])
            )
          )
          | join(',')
        }}
  register: singed_host_key_data

- name: "Write certificate for {{ host_key_path }}"
  become: true
  copy:
    dest: "{{ host_key_path | dirname }}/{{ host_key_path | basename | splitext | first }}-cert.pub"
    content: "{{ singed_host_key_data.data.data.signed_key }}"
    mode: 0644
    owner: root
    group: root
...
