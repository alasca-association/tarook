---
- name: Install dependencies
  become: true
  package:
    name:
    - jq
    - moreutils
    state: present

- name: Deploy renew SSH certificate automation
  become: true
  block:
  # Migration task, remove me in a future release
  - name: Ensure /var/lib/yaook-k8s/ does not exist
    file:
      path: /var/lib/yaook-k8s
      state: absent

  - name: Ensure directory for TAROOK utilities exists
    file:
      path: "/usr/local/lib/tarook"
      state: directory
      mode: u=rwx,go=rx
      recurse: true

  - name: Deploy renew SSH certificate script
    template:
      dest: /usr/local/lib/tarook/get-ssh-cert.sh
      src: get-ssh-cert.sh.j2
      owner: root
      group: root
      mode: 0740

  - name: Deploy renew SSH certificate service
    copy:
      dest: /etc/systemd/system
      src: renew-ssh-certificates.service
      owner: root
      group: root
      mode: 0755

  - name: Deploy renew SSH certificate timer
    copy:
      dest: /etc/systemd/system
      src: renew-ssh-certificates.timer
      owner: root
      group: root
      mode: 0755

  - name: Enable timer
    systemd_service:
      name: renew-ssh-certificates.timer
      enabled: true
      no_block: true

  - name: Trigger SSH certificate renewal
    systemd_service:
      state: started
      daemon_reload: true
      name: renew-ssh-certificates
...
