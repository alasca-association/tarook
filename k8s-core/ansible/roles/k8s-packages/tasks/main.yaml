---
- name: Install prerequisites
  become: true
  apt:
    update_cache: true
    state: present
    name:
      - curl
      - apt-transport-https
      - gnupg
  register: task_result
  until: task_result is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"
  when: ansible_pkg_mgr == 'apt'

- name: Expand NO_PROXY configuration on Ubuntu machines
  when: cluster_behind_proxy and ansible_distribution == 'Ubuntu'
  become: true
  lineinfile:
    path: /etc/environment
    regexp: "^(.*{{ item }}.*)$"
    line: "{{ item }}={{ no_proxy | join(',') }},{{ k8s_network_pod_subnet }},{{ k8s_network_service_subnet }},{{ subnet_cidr }},{{ networking_fixed_ip }}"
    state: present
  loop:
    - NO_PROXY
    - no_proxy

- name: Expand NO_PROXY configuration on RHEL machines
  when: cluster_behind_proxy and ansible_distribution == 'Red Hat Enterprise Linux'
  become: true
  lineinfile:
    path: /etc/profile.d/proxy.sh
    regexp: "^(.*{{ item }}.*)$"
    line: "{{ item }}={{ no_proxy | join(',') }},{{ k8s_network_pod_subnet }},{{ k8s_network_service_subnet }},{{ subnet_cidr }},{{ networking_fixed_ip }}"
    state: present
  loop:
    - NO_PROXY
    - no_proxy

- name: Include package repository configuration
  include_tasks:
    file: configure-package-repo.yaml

- name: Install kubelet, kubeadm, kubectl and cri-tools
  block:
    - name: Remove hold of packages if migration needed  # noqa no-changed-when no-handler
      when: drop_google_repo.changed | default(False)
      become: true
      command: apt-mark unhold kubelet kubeadm kubectl cri-tools

    - name: Install kubelet, kubeadm, kubectl and cri-tools
      # Note: check available version with `apt-cache policy <package name>`
      become: true
      package:
        state: present
        name:
          - "kubelet={{ k8s_version }}-*"
          - "kubeadm={{ k8s_version }}-*"
          - "kubectl={{ k8s_version }}-*"
          # NOTE: cri-tools follows Kubernetes' release cycle but unlike
          #       kubelet/kubeadm/kubectl only with respect to its minor version.
          #       see https://github.com/kubernetes-sigs/cri-tools/blob/46c81013b00ea238cd39499df021441ae51ec65f/README.md#compatibility-matrix-cri-tools--kubernetes
          - "cri-tools={{
              k8s_version
              | regex_replace('^(?P<maj>\\d+)[.](?P<min>\\d+)[.].*$', '\\g<maj>.\\g<min>')
            }}.*"
      register: task_result
      until: task_result is not failed
      retries: "{{ error_retries }}"
      delay: "{{ error_delay }}"
      notify: Restart kubelet

    - name: Prevent the k8s packages for being updated  # noqa no-changed-when
      become: true
      command: apt-mark hold kubelet kubeadm kubectl cri-tools

# kubelet should be restarted immediately
- name: Force restart of kubelet at this point
  meta: flush_handlers
...
