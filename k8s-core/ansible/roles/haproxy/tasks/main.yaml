---
- name: Install HAProxy
  become: true
  package:
    state: present
    name:
      - haproxy
  register: task_result
  until: task_result is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"

- name: Create directory for HAProxy configurations
  become: true
  file:
    state: directory
    path: /etc/haproxy/conf.d/
    owner: root
    group: root
    mode: 0600

- name: Create HAProxy configuration
  become: true
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/conf.d/00_haproxy.cfg
    validate: haproxy -f %s -c
    mode: 0600
    owner: root
    group: root
  notify: Restart the haproxy service

- name: Configure HAProxy to use the directory as config source
  become: true
  template:
    src: config.cfg.j2
    dest: "{{ haproxy_service_config_map[ansible_os_family] }}"
    owner: root
    group: root
    mode: 0640
  notify: Restart the haproxy service

- name: Create HAProxy config for the k8s API server
  become: true
  template:
    src: k8s-apiserver.cfg.j2
    dest: /etc/haproxy/conf.d/20_k8s-apiserver.cfg
    validate: haproxy -f %s -c
    mode: 0600
    owner: root
    group: root
  notify: Restart the haproxy service

- name: Ensure HAProxy systemd drop-in directory exists
  become: true
  file:
    path: /etc/systemd/system/haproxy.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Add HAProxy override for ordering after keepalived
  become: true
  copy:
    dest: /etc/systemd/system/haproxy.service.d/run-after-keepalived.conf
    content: |
      [Unit]
      After=keepalived.service
      Wants=keepalived.service
    owner: root
    group: root
    mode: '0600'
  notify: Restart the haproxy service

- name: Force setting net.ipv4.ip_nonlocal_bind before HAProxy starts
  become: true
  when: ipv4_enabled | bool
  copy:
    dest: /etc/systemd/system/haproxy.service.d/nonlocal-bind-v4.conf
    content: |
      [Service]
      ExecStartPre=/sbin/sysctl -w net.ipv4.ip_nonlocal_bind=1
    owner: root
    group: root
    mode: '0600'
  notify: Restart the haproxy service

- name: Force setting net.ipv6.ip_nonlocal_bind before HAProxy starts
  become: true
  when: ipv6_enabled | bool
  copy:
    dest: /etc/systemd/system/haproxy.service.d/nonlocal-bind-v6.conf
    content: |
      [Service]
      ExecStartPre=/sbin/sysctl -w net.ipv6.ip_nonlocal_bind=1
    owner: root
    group: root
    mode: '0600'
  notify: Restart the haproxy service

- name: Ensure the haproxy service is enabled and started
  become: true
  systemd:
    enabled: true
    state: started
    name: haproxy
...
