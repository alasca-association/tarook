---
- name: kubeadm upgrade plan & apply
  become: true
  when: do_upgrade | bool
  block:
    - name: Run kubeadm upgrade plan  # noqa no-changed-when
      vars:
        kubeadm_expression:
          - "kubeadm"
          - "upgrade"
          - "--ignore-preflight-errors=CreateJob" # timeout is hardcoded to 15s, so we ignore errors
          - "plan"
      include_role:
        name: helpers/kubeadm-command

    # Do not renew certificates here because we rolled out our own chain
    # --yes auto-confirms and makes upgrade non-interactive
    - name: Execute the upgrade
      vars:
        kubeadm_expression:
          - "kubeadm"
          - "upgrade"
          - "apply"
          - "--yes"
          - "v{{ next_k8s_version }}"
          - "--certificate-renewal=false"
          - "--ignore-preflight-errors=CreateJob"
          - "--patches"
          - "{{ k8s_kubeadm_patches_remote_dir }}"
      include_role:
        name: helpers/kubeadm-command

# Running kubeadm upgrade apply potentially resets
# the KubeletConfiguration on the node
# We have to reconfigure it before continuing therefore
- name: Configure and restart kubelet
  include_role:
    name: kubelet-configuration
...
