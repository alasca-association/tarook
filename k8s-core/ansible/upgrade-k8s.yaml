---
- name: Initialize node connection
  import_playbook: "connect-to-nodes.yaml"
  vars:
    target_hosts: k8s_nodes

- name: Fail if node got not bootstrapped once, yet
  any_errors_fatal: true
  hosts: k8s_nodes
  tasks:
    - name: Fail if node got not bootstrapped once, yet
      when: not ansible_local['bootstrap']['bootstrapped'] | default(False) | bool
      fail:
        msg: |
          ERROR

          We're at an advanced stage of the rollout,
          but the node did not get bootstrapped yet!
          Please ensure the k8s-core/bootstrap playbook
          is executed at least once against every node
          before proceeding.
          This is automatically done if the install-all
          playbook of either k8s-core or k8s-supplements is executed.

- name: Renew PKI (CP)
  hosts: masters
  gather_facts: true
  vars_files:
    - vars/etc.yaml
    - vars/retries.yaml
    - vars/vault-config.yaml
  serial:
    - 1
    - "100%"
  roles:
    - name: Include config/k8s-config
      role: config/k8s-config
  tasks:
    - name: Obtain CAs (CP)
      include_role:
        name: k8s-master
        tasks_from: ensure-cas.yaml
      tags:
        - renew-pki
    - name: Obtain kubeconfigs (CP)
      include_role:
        name: k8s-master
        tasks_from: obtain-kubeconfigs.yaml
      tags:
        - renew-pki
    - name: Obtain certificates (CP)
      include_role:
        name: k8s-master
        tasks_from: obtain-certs.yaml
      tags:
        - renew-pki
    - name: Provide CA certificates as ConfigMap
      include_role:
        name: k8s-master
        tasks_from: provide-ca-as-cm.yaml
      tags:
        - renew-pki

- name: Patch kubelet ConfigMap
  hosts: orchestrator
  gather_facts: false
  vars_files:
    - vars/retries.yaml
  roles:
    # Drop me along with Kubernetes v1.31
    - role: migrations/kubelet-config-map-patch
      when:
        - ipv4_enabled and ipv6_enabled
        - next_k8s_version is version('1.32', '>=')
        - next_k8s_version is version('1.33', '<')
      tags: migrations/kubelet-config-map-patch

- name: Renew PKI (Worker)
  hosts: workers
  gather_facts: true
  vars_files:
    - vars/etc.yaml
    - vars/retries.yaml
    - vars/vault-config.yaml
  roles:
    - name: Include config/k8s-config
      role: config/k8s-config
  tasks:
    - name: Obtain CAs (Worker)
      include_role:
        name: k8s-worker
        tasks_from: obtain-cas.yaml
      tags:
        - renew-pki
    - name: Obtain kubeconfigs (Worker)
      include_role:
        name: k8s-worker
        tasks_from: obtain-kubeconfigs.yaml
      tags:
        - renew-pki

- name: Upgrade kubeadm on all control plane nodes
  hosts: masters
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - vars/retries.yaml
    - vars/auto_generated_preamble.yaml
  roles:
    - role: kubeadm-upgrade-kubeadm
    - role: kubeadm-patches

- name: Run kubeadm upgrade apply on the first control plane node
  hosts: masters[0]
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: kubeadm-upgrade-apply

- name: Run kubeadm upgrade node on remaining control plane nodes
  hosts: masters[1:]
  serial: 1
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: kubeadm-upgrade-node

- name: Complete control plane upgrade
  hosts: masters
  serial: 1
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - vars/disruption.yaml
    - vars/retries.yaml
    - vars/auto_generated_preamble.yaml
  roles:
    - role: cluster-health-verification
      delegate_to: "{{ groups['orchestrator'] | first }}"
      when: not (k8s_skip_upgrade_checks | bool)
    - role: kubeadm-drain-node
    - role: update-system
    - role: kubeadm-upgrade-kubelet
    - role: kubeadm-uncordon-node

- name: Upgrade the worker nodes
  hosts: workers
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - vars/disruption.yaml
    - vars/retries.yaml
    - vars/auto_generated_preamble.yaml
  serial: 1
  roles:
    - role: cluster-health-verification
      delegate_to: "{{ groups['orchestrator'] | first }}"
      when: not (k8s_skip_upgrade_checks | bool)
    - role: kubeadm-drain-node
    - role: kubeadm-upgrade-kubeadm
    - role: update-system
    - role: kubeadm-upgrade-node
    - role: kubeadm-upgrade-kubelet
  # The nvidia-device-plugin marks a GPU as unhealthy
  # on systemctl daemon-reloads + kubelet restarts,
  # but the Pod does not fail. We have to manually restart the Pod.
  tasks:
    - name: Restart nvidia-device-plugin Pod on node
      include_role:
        name: nvidia-device-plugin
        tasks_from: restart_ndp_pod.yaml
    - name: Uncordon the node
      include_role:
        name: kubeadm-uncordon-node
...
