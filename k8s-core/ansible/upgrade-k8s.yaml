---
- name: Initialize node connection
  import_playbook: "connect-to-nodes.yaml"
  vars:
    target_hosts: k8s_nodes

- name: Fail if node got not bootstrapped once, yet
  any_errors_fatal: true
  hosts: k8s_nodes
  tasks:
    - name: Fail if node got not bootstrapped once, yet
      when: not ansible_local['bootstrap']['bootstrapped'] | default(False) | bool
      fail:
        msg: |
          ERROR

          We're at an advanced stage of the rollout,
          but the node did not get bootstrapped yet!
          Please ensure the k8s-core/bootstrap playbook
          is executed at least once against every node
          before proceeding.
          This is automatically done if the install-all
          playbook of either k8s-core or k8s-supplements is executed.

- name: Renew PKI (CP)
  hosts: masters
  gather_facts: true
  vars_files:
    - vars/etc.yaml
    - vars/retries.yaml
    - vars/vault-config.yaml
  serial:
    - 1
    - "100%"
  tasks:
    - name: Obtain CAs (CP)
      include_role:
        name: k8s-master
        tasks_from: ensure-cas.yaml
      tags:
        - renew-pki
    - name: Obtain kubeconfigs (CP)
      include_role:
        name: k8s-master
        tasks_from: obtain-kubeconfigs.yaml
      tags:
        - renew-pki
    - name: Obtain certificates (CP)
      include_role:
        name: k8s-master
        tasks_from: obtain-certs.yaml
      tags:
        - renew-pki
    - name: Provide CA certificates as ConfigMap
      include_role:
        name: k8s-master
        tasks_from: provide-ca-as-cm.yaml
      tags:
        - renew-pki

- name: Renew PKI (Worker)
  hosts: workers
  gather_facts: true
  vars_files:
    - vars/etc.yaml
    - vars/retries.yaml
    - vars/vault-config.yaml
  tasks:
    - name: Obtain CAs (Worker)
      include_role:
        name: k8s-worker
        tasks_from: obtain-cas.yaml
      tags:
        - renew-pki
    - name: Obtain kubeconfigs (Worker)
      include_role:
        name: k8s-worker
        tasks_from: obtain-kubeconfigs.yaml
      tags:
        - renew-pki

- name: Upgrade kubeadm on all control plane nodes
  hosts: masters
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - vars/retries.yaml
    - vars/auto_generated_preamble.yaml
  roles:
    - role: kubeadm-upgrade-kubeadm
    - role: kubeadm-patches

- name: Run kubeadm upgrade apply on the first control plane node
  hosts: masters[0]
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: kubeadm-upgrade-apply

- name: Run kubeadm upgrade node on remaining control plane nodes
  hosts: masters[1:]
  serial: 1
  gather_facts: true
  any_errors_fatal: true
  roles:
    - role: kubeadm-upgrade-node

- name: Complete control plane upgrade
  hosts: masters
  serial: 1
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - vars/disruption.yaml
    - vars/retries.yaml
    - vars/auto_generated_preamble.yaml
  tasks:
    - block:
        - include_role:
            name: cluster-health-verification
          when: not (k8s_skip_upgrade_checks | bool)
        - name: "Get info of Kubernetes node {{ inventory_hostname }}"
          delegate_to: "{{ groups['orchestrator'] | first }}"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Node
            name: "{{ inventory_hostname }}"
          register: _k8s_node_info
        - include_role:
            name: kubeadm-drain-node
        - include_role:
            name: containerd
        - include_role:
            name: update-system
        - include_role:
            name: kubeadm-upgrade-kubelet
      always:
        - include_role:
            name: kubeadm-uncordon-node
          # Only uncordon node if it was previously uncordoned
          when: not (_k8s_node_info.resources[0].spec.unschedulable | default(false) | bool)

- name: Upgrade the worker nodes
  hosts: workers
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - vars/disruption.yaml
    - vars/retries.yaml
    - vars/auto_generated_preamble.yaml
  serial: 1
  tasks:
    - block:
        - include_role:
            name: cluster-health-verification
          when: not (k8s_skip_upgrade_checks | bool)
        - name: "Get info of Kubernetes node {{ inventory_hostname }}"
          delegate_to: "{{ groups['orchestrator'] | first }}"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Node
            name: "{{ inventory_hostname }}"
          register: _k8s_node_info
        - include_role:
            name: kubeadm-drain-node
        - include_role:
            name: containerd
        - include_role:
            name: kubeadm-upgrade-kubeadm
        - include_role:
            name: update-system
        - include_role:
            name: kubeadm-upgrade-node
        - include_role:
            name: kubeadm-upgrade-kubelet
      always:
        - include_role:
            name: kubeadm-uncordon-node
          # Only uncordon node if it was previously uncordoned
          when: not (_k8s_node_info.resources[0].spec.unschedulable | default(false) | bool)
...
