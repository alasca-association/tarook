---
- name: Import dependency roles needed when running on OpenStack
  when: openstack_enabled | bool
  block:
  - name: Import bird
    import_role:
      name: bird
  - name: Import nftables
    import_role:
      name: nftables

- name: Deploy LBaaS agent
  become: true
  block:
  - name: Create user
    user:
      system: true
      name: "{{ ch_k8s_lbaas_agent_user }}"
      home: /dev/null
      shell: /bin/false

  - name: Create configuration directory
    file:
      state: directory
      owner: root
      group: "{{ ch_k8s_lbaas_agent_user }}"
      mode: u=rwx,g=rx,o-rwx
      path: "{{ ch_k8s_lbaas_agent_config_directory }}"

  # This is used to avoid having to re-download the binary from the source
  # all the time. This task will be "changed" whenever the URL or checksum
  # passed to the get_url module below changes, allowing to force a
  # re-download exactly when necessary.
  - name: Store id tag
    template:
      src: binary_id_tag.j2
      dest: "{{ ch_k8s_lbaas_agent_config_directory }}/version"
      owner: root
      group: root
      mode: ugo-rwx
    register: version

  - name: Download executable
    get_url:
      url: "{{ ch_k8s_lbaas_agent_binary_url }}"
      checksum: "{{ ch_k8s_lbaas_agent_binary_checksum }}"
      dest: "{{ ch_k8s_lbaas_agent_binary_path }}"
      force: "{{ (version is changed) | ternary(True, False) }}"
      owner: root
      group: root
      mode: ugo=rx
    register: task_result
    until: task_result is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"
    notify:
    - restart ch-k8s-lbaas-agent

  - name: Configure service
    template:
      src: agent-config.toml.j2
      dest: "{{ ch_k8s_lbaas_agent_config_directory }}/config.toml"
      owner: root
      group: "{{ ch_k8s_lbaas_agent_user }}"
      mode: u=rw,g=r,o-rwx
    notify:
    - restart ch-k8s-lbaas-agent

  - name: Configure sudoers
    template:
      src: sudoers.j2
      dest: /etc/sudoers.d/lbaas
      owner: root
      group: root
      mode: u=rw,go=r
      validate: /usr/sbin/visudo -cf %s

  - name: Define service
    template:
      src: ch-k8s-lbaas-agent.service.j2
      dest: /etc/systemd/system/ch-k8s-lbaas-agent.service
      owner: root
      group: root
      mode: u=rw,go=r
    register: agent_service
    notify:
    - restart ch-k8s-lbaas-agent

  # Migration task, remove me with TAROOK v12
  - name: Remove legacy no-SNAT configuration
    file:
      state: absent
      path: "/etc/bird.d/01-no-snat.conf"
    notify: restart bird

  - name: Start service
    systemd:
      name: ch-k8s-lbaas-agent
      daemon_reload: "{{ agent_service is changed }}"
      state: started
      enabled: true

  # Need to do that *after* the service is started, because systemd creates the
  # /var/lib/ch-k8s-lbaas-agent/nftables directory.
  - name: Configure firewall for agent access
    template:
      src: nftables.conf.j2
      dest: "{{ ch_k8s_lbaas_agent_state_directory }}/nftables/access.conf"
      owner: root
      group: root
      mode: "u=rw,go=r"
    notify: reload nftables
    when: openstack_enabled | bool
...
