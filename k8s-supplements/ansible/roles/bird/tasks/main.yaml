---
- name: install bird
  become: true
  apt:
    name: "{{ bird_package }}"
    state: present
  register: task_result
  until: task_result is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"
  tags:
  - bird

- name: configure bird
  become: true
  template:
    src: "{{ bird_package }}.conf.j2"
    dest: /etc/bird/bird.conf
    owner: bird
    group: bird
    mode: 0o640
  notify: restart bird
  tags:
  - bird

- name: drop-in directory for bird config
  become: true
  file:
    state: directory
    path: /etc/bird.d/
    owner: root
    group: bird
    mode: "u=rwx,g=rx,o-rwx"
  tags:
  - bird

# TODO: @deprecated::debian12 This task can be dropped when removing support for Debian 12
- name: disable bird6
  become: true
  service:
    name: bird6
    enabled: false
    state: stopped
  when:
  - not (ipv6_enabled | bool)
  - bird_package == "bird"
  tags:
  - bird

# TODO: @deprecated::debian12 This task can be dropped when removing support for Debian 12
- name: Initialize config of bird6 for IPv6 support
  become: true
  when:
  - ipv6_enabled | bool
  - bird_package == "bird"
  tags:
  - bird6
  block:
  - name: Create config for bird6 in /etc/bird/
    template:
      src: bird6.conf.j2
      dest: /etc/bird/bird6.conf
      owner: bird
      group: bird
      mode: 0640
    notify: restart bird6

  - name: Create drop-in directory for bird6 configs
    file:
      state: directory
      path: /etc/birdv6.d/
      owner: root
      group: bird
      mode: "u=rwx,g=rx,o-rwx"

  - name: enable bird6
    service:
      name: bird6
      enabled: true
      state: started
    when: bird_package == "bird"

- name: Setup BGP configuration for calico
  become: true
  tags:
  - calico
  - bird
  block:
  - name: Configure BIRD for calico (IPv4)
    template:
      src: "{{ bird_package }}-calico.conf.j2"
      dest: /etc/bird.d/10-k8s-calico.conf
      owner: root
      group: bird
      mode: "u=rw,g=r,o-rwx"
    notify: restart bird
    when: ipv4_enabled | bool

  # TODO: @deprecated::debian12 This task can be dropped when removing support for Debian 12
  - name: Configure BIRD for calico (IPv6)
    template:
      src: bird-calico-v6.conf.j2
      dest: /etc/birdv6.d/10-k8s-calico-ipv6.conf
      owner: root
      group: bird
      mode: "u=rw,g=r,o-rwx"
    notify: restart bird6
    # bird3 has no seperate service for IPv6
    when:
    - ipv6_enabled | bool
    - bird_package == "bird"
...
