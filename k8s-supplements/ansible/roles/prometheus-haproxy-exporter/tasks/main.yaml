---
- name: Installation on Debian
  when: ansible_os_family == 'Debian'
  block:
    - name: Install prometheus-haproxy-exporter
      become: true
      apt:
        update_cache: true
        state: present
        name:
          - prometheus-haproxy-exporter
      register: task_result
      until: task_result is not failed
      retries: "{{ error_retries }}"
      delay: "{{ error_delay }}"

    - name: Register service user fact for prometheus-haproxy-exporter on Debian
      set_fact:
        phe_user: "prometheus"

    - name: Configure the exporter
      become: true
      template:
        src: prometheus-haproxy-exporter.default.j2
        dest: /etc/default/prometheus-haproxy-exporter
        owner: root
        group: root
        mode: u=rwx,g=rx,o-rwx
      register: phe_default_config

- name: Add user prometheus to group haproxy to access admin sock
  become: true
  user:
    append: true
    name: "{{ phe_user }}"
    groups:
      - haproxy

- name: Enable & restart prometheus-haproxy-exporter
  become: true
  systemd:
    name: prometheus-haproxy-exporter
    state: "{{ (phe_default_config is changed) | ternary('restarted', 'started') }}"
    enabled: true
    daemon-reload: true
...
