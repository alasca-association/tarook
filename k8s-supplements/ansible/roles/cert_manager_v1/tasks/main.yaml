---
- name: Create namespace
  when: k8s_cert_manager_install | bool
  kubernetes.core.k8s:
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k8s_cert_manager_helm_release_namespace }}"
    validate:
      fail_on_error: true
      strict: true
  # Retry this task on failures
  register: k8s_apply
  until: k8s_apply is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"

- name: "{{ k8s_cert_manager_install | ternary('I', 'Uni') }}nstall Cert Manager"
  kubernetes.core.helm:
    chart_repo_url: "{{ k8s_cert_manager_helm_chart_repo_url }}"
    chart_ref: "{{ k8s_cert_manager_helm_chart_ref }}"
    release_namespace: "{{ k8s_cert_manager_helm_release_namespace }}"
    release_name: "{{ k8s_cert_manager_helm_release_name }}"
    release_state: "{{ k8s_cert_manager_install | ternary('present', 'absent') }}"
    chart_version: "{{ k8s_cert_manager_helm_chart_version }}"
    values: "{{ k8s_cert_manager_helm_values | to_json }}"

- name: "{{ (k8s_cert_manager_install and (k8s_cert_manager_letsencrypt_email is not none)) | ternary('I', 'Uni') }}nstall Let's Encrypt cluster issuer"
  kubernetes.core.k8s:
    apply: true
    state: "{{ (k8s_cert_manager_letsencrypt_email is not none) | ternary('present', 'absent') }}"
    definition:
      apiVersion: v1
      kind: ClusterIssuer
      metadata:
        name: k8s-letsencrypt
      spec:
        acme:
          email: "{{ k8s_cert_manager_letsencrypt_email | default('') }}"
          preferredChain: "{{ k8s_cert_manager_letsencrypt_preferred_chain | default('') }}"
          privateKeySecretRef:
            name: letsencrypt-default-issuer-account-key
          server: "{{ k8s_cert_manager_letsencrypt_server }}"
          solvers:
          - http01:
              ingress:
                class: "{{ k8s_cert_manager_letsencrypt_ingress }}"
  # Retry this task on failures
  register: k8s_apply
  until: k8s_apply is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"
...
