---
- name: Create namespace for fluxcd
  kubernetes.core.k8s:
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ fluxcd_helm_release_namespace }}"
        labels:
          app.kubernetes.io/instance: flux-system
          app.kubernetes.io/part-of: flux
          pod-security.kubernetes.io/warn: restricted
          pod-security.kubernetes.io/warn-version: latest
    validate:
      fail_on_error: true
      strict: true
  # Retry this task on failures
  register: k8s_apply
  until: k8s_apply is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"

- name: Install fluxcdv2
  kubernetes.core.helm:
    chart_repo_url: "{{ fluxcd_helm_chart_repo_url }}"
    chart_ref: "{{ fluxcd_helm_chart_ref }}"
    release_namespace: "{{ fluxcd_helm_release_namespace }}"
    release_name: "{{ fluxcd_helm_release_name }}"
    release_state: "{{ fluxcd_install | ternary('present', 'absent') }}"
    values: "{{ fluxcd_helm_values | to_json }}"
    chart_version: "{{ fluxcd_helm_chart_version }}"
...
