---
- name: Check if tigera-operator already exists
  delegate_to: "{{ groups['orchestrator'] | first }}"
  run_once: true
  block:
    - name: Check if tigera-operator Deployment exists
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Deployment
        name: tigera-operator
        namespace: "{{ k8s_network_calico_helm_release_namespace }}"
      register: tigera_operator_deployment
      until: tigera_operator_deployment is not failed
      retries: "{{ error_retries }}"
      delay: "{{ error_delay }}"

    - name: Set fact if tigera-operator Deployment exists
      set_fact:
        tigera_operator_exists: "{{ (tigera_operator_deployment.resources | default([]) | length) >= 1 }}"

- name: Deploy tigera-operator
  delegate_to: "{{ groups['orchestrator'] | first }}"
  run_once: true
  block:
    - name: Create Tigera operator namespace
      kubernetes.core.k8s:
        apply: true
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ k8s_network_calico_helm_release_namespace }}"
        validate:
          fail_on_error: true
          strict: true
      # Retry this task on failures
      register: k8s_apply
      until: k8s_apply is not failed
      retries: "{{ error_retries }}"
      delay: "{{ error_delay }}"

    - name: Deploy Tigera operator chart
      kubernetes.core.helm:
        chart_repo_url: "{{ k8s_network_calico_helm_chart_repo_url }}"
        chart_version: "{{ k8s_network_calico_helm_chart_version }}"
        chart_ref: "{{ k8s_network_calico_helm_chart_ref }}"
        release_namespace: "{{ k8s_network_calico_helm_release_namespace }}"
        release_name: "{{ k8s_network_calico_helm_release_name }}"
        release_state: present
        values: "{{ k8s_network_calico_helm_values | to_json }}"

    # Give the operator some time to create the CRDs
    - name: Pause for 20s
      when: not (tigera_operator_exists | bool)
      pause:
        seconds: 20

- name: Install calicoctl
  become: true
  get_url:
    url: "{{ calico_calicoctl_binary_source }}/v{{ k8s_network_calico_helm_chart_version }}/calicoctl-linux-amd64"
    dest: /usr/local/bin/calicoctl
    owner: root
    group: root
    mode: 0750
    timeout: 30
  register: task_result
  until: task_result is not failed
  retries: "{{ error_retries }}"

- name: Setup BGP Routing Information Distribution via BIRD
  run_once: true
  include_tasks: setup_bgp.yaml
...
