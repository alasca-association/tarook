---
- name: Create calico BGP configuration and apply peering
  delegate_to: "{{ groups['orchestrator'] | first }}"
  block:
  - name: Wait for all Calico API servers to be up and running
    kubernetes.core.k8s_info:
      api_version: operator.tigera.io/v1
      kind: APIServer
      name: default
    # Retry this task on failures
    register: calico_apiserver
    until:
    - calico_apiserver.resources | length >= 1
    - calico_apiserver.resources | map(attribute='status.state', default='') | select('ne', 'Ready') | list | length == 0
    retries: 120
    delay: "{{ error_delay }}"

  - name: BGP - Apply default calico BGP configuration
    kubernetes.core.k8s:
      apply: true
      definition: "{{ lookup('template', 'bgp.yaml.j2') | from_yaml_all }}"
      validate:
        fail_on_error: true
        strict: true
    # Retry this task on failures
    register: k8s_apply
    until: k8s_apply is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"

  - name: BGP - Label CP nodes as route reflectors
    kubernetes.core.k8s:
      state: patched
      kind: Node
      name: "{{ item }}"
      definition:
        metadata:
          annotations:
            projectcalico.org/RouteReflectorClusterID: "{{ k8s_network_calico_bgp_router_id }}"
          labels:
            route-reflector: "true"
      validate:
        fail_on_error: true
        strict: true
    # Retry this task on failures
    register: k8s_apply
    until: k8s_apply is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"
    loop: "{{ groups['masters'] }}"
...
