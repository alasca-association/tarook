---
- name: Create architecture-specific service monitors
  block:
  - name: Create keepalived service monitor (frontend)
    kubernetes.core.k8s:
      state: present
      apply: true
      definition: "{{ lookup('template', 'keepalived-service-monitor.yaml.j2') }}"
      validate:
        fail_on_error: true
        strict: true
    # Retry this task on failures
    register: k8s_apply
    until: k8s_apply is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"

  - name: "{{ (groups['gateways'] | default([]) | length > 0) | ternary('Create', 'Delete') }} bird service monitor (gateway-frontend)"
    kubernetes.core.k8s:
      # Only deploy when we have actual gateway nodes
      state: "{{ (groups['gateways'] | default([]) | length > 0) | ternary('present', 'absent') }}"
      apply: true
      definition: "{{ lookup('template', 'bird-service-monitor.yaml.j2') }}"
      validate:
        fail_on_error: true
        strict: true
    # Retry this task on failures
    register: k8s_apply
    until: k8s_apply is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"

  - name: Create HAProxy service monitor (frontend)
    kubernetes.core.k8s:
      state: present
      apply: true
      definition: "{{ lookup('template', 'haproxy-service-monitor.yaml.j2') }}"
      validate:
        fail_on_error: true
        strict: true
    # Retry this task on failures
    register: k8s_apply
    until: k8s_apply is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"

  - name: "{{ ch_k8s_lbaas_enabled | ternary('Create', 'Delete') }} ch-k8s-LBaaS service monitors (frontend)"
    kubernetes.core.k8s:
      definition: "{{ lookup('template', 'lbaas-service-monitor.yaml.j2') }}"
      apply: true
      state: "{{ ch_k8s_lbaas_enabled | ternary('present', 'absent') }}"
      validate:
        fail_on_error: true
        strict: true
    # Retry this task on failures
    register: k8s_apply
    until: k8s_apply is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"

  - name: Create rook-ceph-mgr service monitor
    kubernetes.core.k8s:
      state: present
      apply: true
      definition: "{{ lookup('template', 'rook-service-monitor.yaml.j2') }}"
      validate:
        fail_on_error: true
        strict: true
    when: rook_enabled | bool
    # Retry this task on failures
    register: k8s_apply
    until: k8s_apply is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"

  - name: "{{ (groups['gateways'] | default([]) | length > 0) | ternary('Create', 'Delete') }} service monitor node-exporters (gateway-frontend)"
    kubernetes.core.k8s:
      # Only deploy when we have actual gateway nodes
      state: "{{ (groups['gateways'] | default([]) | length > 0) | ternary('present', 'absent') }}"
      apply: true
      definition: "{{ lookup('template', 'node-exporter-service-monitor.yaml.j2') }}"
      validate:
        fail_on_error: true
        strict: true
    # Retry this task on failures
    register: k8s_apply
    until: k8s_apply is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"
    tags:
    - node-exporter-service-monitor

  - name: Create monitoring resources for calico (operator-based)
    kubernetes.core.k8s:
      state: present
      apply: true
      definition: "{{ lookup('template', 'calico-tigera-monitoring.yaml.j2') }}"
      validate:
        fail_on_error: true
        strict: true
    # Retry this task on failures
    register: k8s_apply
    until: k8s_apply is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"
    tags:
    - calico-service-monitor

  - name: Create a pod monitor for fluxcd
    when: fluxcd_enabled | bool
    kubernetes.core.k8s:
      state: present
      apply: true
      definition: "{{ lookup('template', 'fluxcd_podmonitor.yaml.j2') }}"
      validate:
        fail_on_error: true
        strict: true
    # Retry this task on failures
    register: k8s_apply
    until: k8s_apply is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"
    tags:
    - fluxcd
...
