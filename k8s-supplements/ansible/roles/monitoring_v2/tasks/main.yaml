---
- name: Patch kube-proxy
  include_tasks:
    file: kube_proxy_patch.yaml
  when: k8s_monitoring_enabled and k8s_network_kube_proxy_enabled

- name: Create namespace
  when: k8s_monitoring_enabled | bool
  kubernetes.core.k8s:
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ monitoring_helm_release_namespace }}"
    validate:
      fail_on_error: true
      strict: true
  # Retry this task on failures
  register: k8s_apply
  until: k8s_apply is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"

- name: Rollout the etcd-metrics-proxy
  include_role:
    name: etcd-metrics-proxy

- name: Check if admin secret for Grafana already exists
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ monitoring_grafana_admin_secret_name }}"
    namespace: "{{ monitoring_helm_release_namespace }}"
  register: grafana_admin
  until: grafana_admin is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"

- name: Create default admin secret for Grafana
  when: (grafana_admin.resources | default([]) | length) == 0
  kubernetes.core.k8s:
    state: present
    apply: true
    definition: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ monitoring_grafana_admin_secret_name }}"
        namespace: "{{ monitoring_helm_release_namespace }}"
      data:
        # admin:prom-operator, default credentials
        admin-user: YWRtaW4=
        admin-password: cHJvbS1vcGVyYXRvcg==
    validate:
      fail_on_error: true
      strict: true
  # Retry this task on failures
  register: k8s_apply
  until: k8s_apply is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"

- name: Copy CA file from kube-system namespace
  include_tasks: copy-ca-as-cm.yaml

# Install the prometheus stack
- name: "{{ monitoring_install | ternary('I', 'Uni') }}nstall KSL monitoring stack"
  kubernetes.core.helm:
    chart_repo_url: "{{ monitoring_helm_chart_repo_url }}"
    chart_ref: "{{ monitoring_helm_chart_ref }}"
    chart_version: "{{ monitoring_helm_chart_version }}"
    release_namespace: "{{ monitoring_helm_release_namespace }}"
    release_name: "{{ monitoring_helm_release_name }}"
    release_state: "{{ monitoring_install | ternary('present', 'absent') }}"
    values: "{{ monitoring_helm_values | to_json }}"
    wait: false

# Install prometheus-adapter, a metrics-server implementation
# It enables commands like `k top nodes`
- name: "{{ monitoring_install | ternary('I', 'Uni') }}nstall Prometheus adapter"
  kubernetes.core.helm:
    chart_repo_url: "{{ monitoring_prometheus_adapter_helm_chart_repo_url }}"
    chart_ref: "{{ monitoring_prometheus_adapter_helm_chart_ref }}"
    chart_version: "{{ monitoring_prometheus_adapter_helm_chart_version }}"
    release_namespace: "{{ monitoring_prometheus_adapter_helm_release_namespace }}"
    release_name: "{{ monitoring_prometheus_adapter_helm_release_name }}"
    release_state: "{{ monitoring_install | ternary('present', 'absent') }}"
    values: "{{ monitoring_prometheus_adapter_helm_values | to_json }}"
    wait: false

- name: Do we have any gpu nodes?
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    label_selectors:
    - k8s.yaook.cloud/gpu-node=true
  # Retry this task on failures
  register: gpu_nodes
  until: gpu_nodes is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"

- name: NVIDIA DCGM Exporter
  when: (gpu_nodes.resources | length) > 0
  include_tasks: nvidia_dcgm_exporter.yaml

- name: Install thanos with helm
  include_role:
    name: monitoring_thanos_v2
  when: monitoring_use_thanos | bool

- name: "{{ monitoring_internet_probe | ternary('I', 'Uni') }}nstall blackbox-exporter"
  kubernetes.core.helm:
    chart_repo_url: "{{ monitoring_blackbox_exporter_helm_chart_repo_url }}"
    chart_ref: "{{ monitoring_blackbox_exporter_helm_chart_ref }}"
    chart_version: "{{ monitoring_blackbox_exporter_helm_chart_version }}"
    release_namespace: "{{ monitoring_blackbox_exporter_helm_release_namespace }}"
    release_name: "{{ monitoring_blackbox_exporter_helm_release_name }}"
    release_state: "{{ monitoring_internet_probe | ternary('present', 'absent') }}"
    values: "{{ monitoring_blackbox_exporter_helm_values | to_json }}"
    wait: true
...
