---
- name: Remove LBaaS controller
  block:
  - name: Remove LBaaS controller
    kubernetes.core.k8s:
      state: absent
      definition: "{{ lookup('template', item) }}"
      validate:
        fail_on_error: true
        strict: true
    with_items:
    - controller-rbac.yaml.j2
    - controller.yaml.j2
    # Retry this task on failures
    register: k8s_apply
    until: k8s_apply is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"

  - name: Deconfigure LBaaS controller
    kubernetes.core.k8s:
      state: absent
      api_version: v1
      kind: Secret
      namespace: kube-system
      name: ch-k8s-lbaas-controller-config
    # Retry this task on failures
    register: k8s_apply
    until: k8s_apply is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"
...
