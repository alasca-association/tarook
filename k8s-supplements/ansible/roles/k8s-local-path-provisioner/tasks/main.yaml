---
- name: Create mount points
  become: true
  block:
  - name: Create directory structure
    file:
      path: "{{ item }}"
      state: directory
      owner: root
      group: root
      mode: 0755
    loop:
    - "{{ k8s_local_storage_dynamic_data_directory }}"

- name: Configure k8s resources
  delegate_to: "{{ groups['orchestrator'] | first }}"
  run_once: true
  block:
  - name: Create storage class
    kubernetes.core.k8s:
      state: present
      apply: true
      definition: "{{ lookup('template', 'sc.yaml.j2') }}"
      validate:
        fail_on_error: true
        strict: true
    # Retry this task on failures
    register: k8s_apply
    until: k8s_apply is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"

  - name: Create provisioner
    kubernetes.core.k8s:
      state: present
      apply: true
      definition: "{{ lookup('template', 'provisioner.yaml.j2') }}"
      validate:
        fail_on_error: true
        strict: true
    # Retry this task on failures
    register: k8s_apply
    until: k8s_apply is not failed
    retries: "{{ error_retries }}"
    delay: "{{ error_delay }}"
...
