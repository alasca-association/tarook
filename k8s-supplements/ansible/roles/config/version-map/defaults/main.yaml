---
# Minor version of k8s and Calico, e.g., '1.18.9' becomes '1.18'.
k8s_version_minor: '{{ k8s_version | regex_replace("^v?(\d+.\d+)(.\d+)?$", "\1") }}'
next_k8s_version_minor: '{{ next_k8s_version | regex_replace("^v?(\d+.\d+)(.\d+)?$", "\1") if next_k8s_version is defined }}'

# Default image tags for 'our' services, separated by minor k8s release.
# To overwrite any of the tags you probably will have to copy the whole dict
# to your configuration and make the necessary adjustments. Monitoring is
# is not included here because `kube-prometheus` comes with its own type
# of versioning.
image_version_map:
  "1.30":
    openstack:
      # https://artifacthub.io/packages/helm/cloud-provider-openstack/openstack-cloud-controller-manager/2.30.2
      cloud_controller_manager_chart: "2.30.2"
      # https://artifacthub.io/packages/helm/cloud-provider-openstack/openstack-cinder-csi/2.30.0
      cinder_csi_plugin_chart: "2.30.0"
    # https://github.com/projectcalico/calico/releases/tag/v3.28.1
    calico_version: "{{ k8s_network_calico_custom_version | default('3.28.1', true) }}"
    # https://github.com/kubernetes-csi/external-snapshotter/releases/tag/v8.0.1
    volume_snapshot_controller: "v8.0.1"

  "1.31":
    openstack:
      # https://artifacthub.io/packages/helm/cloud-provider-openstack/openstack-cloud-controller-manager/2.31.1
      cloud_controller_manager_chart: "2.31.1"
      # https://artifacthub.io/packages/helm/cloud-provider-openstack/openstack-cinder-csi/2.31.2
      cinder_csi_plugin_chart: "2.31.2"
    # https://github.com/projectcalico/calico/releases/tag/v3.29.1
    calico_version: "{{ k8s_network_calico_custom_version | default('3.29.1', true) }}"
    # https://github.com/kubernetes-csi/external-snapshotter/releases/tag/v8.2.0
    volume_snapshot_controller: "v8.2.0"

  "1.32":
    openstack:
      # https://artifacthub.io/packages/helm/cloud-provider-openstack/openstack-cloud-controller-manager/2.32.0
      cloud_controller_manager_chart: "2.32.0"
      # https://artifacthub.io/packages/helm/cloud-provider-openstack/openstack-cinder-csi/2.32.0
      cinder_csi_plugin_chart: "2.32.0"
    # https://github.com/projectcalico/calico/releases/tag/v3.30.1
    calico_version: "{{ k8s_network_calico_custom_version | default('3.30.1', true) }}"
    # https://github.com/kubernetes-csi/external-snapshotter/releases/tag/v8.2.1
    volume_snapshot_controller: "v8.2.1"

  "1.33":
    openstack:
      # https://artifacthub.io/packages/helm/cloud-provider-openstack/openstack-cloud-controller-manager/2.33.1
      cloud_controller_manager_chart: "2.33.1"
      # https://artifacthub.io/packages/helm/cloud-provider-openstack/openstack-cinder-csi/2.33.1
      cinder_csi_plugin_chart: "2.33.1"
    # https://github.com/projectcalico/calico/releases/tag/v3.30.2
    calico_version: "{{ k8s_network_calico_custom_version | default('3.30.2', true) }}"
    # https://github.com/kubernetes-csi/external-snapshotter/releases/tag/v8.3.0
    volume_snapshot_controller: "v8.3.0"

image_versions: "{{ image_version_map[k8s_version_minor] }}"
...
