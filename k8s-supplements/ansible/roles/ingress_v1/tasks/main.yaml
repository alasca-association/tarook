---
- name: Create namespace
  when: k8s_ingress_install
  kubernetes.core.k8s:
    apply: true
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k8s_ingress_helm_release_namespace }}"
    validate:
      fail_on_error: true
      strict: true
  # Retry this task on failures
  register: k8s_apply
  until: k8s_apply is not failed
  retries: "{{ error_retries }}"
  delay: "{{ error_delay }}"

- name: Install NGINX ingress
  kubernetes.core.helm:
    chart_repo_url: "{{ k8s_ingress_helm_chart_repo_url }}"
    chart_ref: "{{ k8s_ingress_helm_chart_ref }}"
    release_namespace: "{{ k8s_ingress_helm_release_namespace }}"
    release_name: "{{ k8s_ingress_helm_release_name }}"
    release_state: "{{ k8s_ingress_install | ternary('present', 'absent') }}"
    chart_version: "{{ k8s_ingress_helm_chart_version }}"
    values: "{{ k8s_ingress_helm_values | to_json }}"
...
