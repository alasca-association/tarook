---
- name: "Require Flux System to be ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ fluxcd_helm_release_namespace }}"
    name: "{{ item }}"
  register: state
  until:
    - (state.resources[0].status.availableReplicas | default(0)) > 0
    - (state.resources[0].status.availableReplicas | default(0)) == state.resources[0].status.replicas
  delay: 5
  retries: 60
  with_items:
    - helm-controller
    - image-automation-controller
    - image-reflector-controller
    - kustomize-controller
    - notification-controller
    - source-controller
...
